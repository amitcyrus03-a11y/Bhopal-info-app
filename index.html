<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhopal Business Info</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 10px; background: #f0f8ff; }
    h1 { text-align: center; color: #0066cc; }
    .btn { 
      width: 100%; padding: 15px; margin: 8px 0; 
      background: #0066cc; color: white; border: none; 
      border-radius: 8px; font-size: 18px; font-weight: bold;
    }
    .card { 
      background: white; padding: 15px; margin: 10px 0; 
      border-radius: 8px; box-shadow: 0 2px 4px #ccc;
    }
    .card a { 
      display: inline-block; margin-top: 8px; padding: 8px 15px; 
      background: #28a745; color: white; text-decoration: none; 
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Bhopal Business Info</h1>
  
  <button class="btn" onclick="showShops()">🛍️ Supermarket</button>
  <button class="btn" onclick="showServices()">🔧 Services</button>
  <button class="btn" onclick="showFood()">🍕 Khana / Food</button>
  
  <div id="list"></div>

  <script>
    function showShops() {
      document.getElementById('list').innerHTML = `
        <div class="card">
          <b>D Mart</b><br>
          Groceries, Home, Kitchen - Sab kuch<br>
          MP Nagar Zone-1, Bhopal<br>
          <a href="tel:07554061300">Call Karein</a>
        </div>
        <div class="card">
          <b>Reliance Smart Bazaar</b><br>
          Groceries, Fashion, Electronics<br>
          DB Mall, Arera Hills, Bhopal<br>
          <a href="tel:18008910001">Call Karein</a>
        </div>
        <div class="card">
          <b>Big Bazaar</b><br>
          Hypermarket - Sab kuch ek jagah<br>
          Ashima Mall, Hoshangabad Road<br>
          <a href="tel:07556696000">Call Karein</a>
        </div>
        <div class="card">
          <b>More Supermarket</b><br>
          Daily Groceries & Fresh Items<br>
          10 No. Market, Arera Colony<br>
          <a href="tel:07554003100">Call Karein</a>
        </div>
        <div class="card">
          <b>Vishal Mega Mart</b><br>
          Groceries, Fashion at Low Price<br>
          Hamidia Road, Bhopal<br>
          <a href="tel:07554000900">Call Karein</a>
        </div>
        <div class="card">

          Groceries, Dairy, Fresh Veggies<br>
          Kolar Road, Bhopal<br>
          <a href="tel:18001033333">Call Karein</a>

        <div class="card">

          Swadeshi Products, Ayurvedic<br>

    function showServices() {
      document.getElementById('list').innerHTML = `

    }
  </script>
</body>
</html>
