<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhopal Business Info</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 10px; background: #f0f8ff; }
    h1 { text-align: center; color: #0066cc; }
    .btn { 
      width: 100%; padding: 15px; margin: 8px 0; 
      background: #0066cc; color: white; border: none; 
      border-radius: 8px; font-size: 18px; font-weight: bold;
    }
    .card { 
      background: white; padding: 15px; margin: 10px 0; 
      border-radius: 8px; box-shadow: 0 2px 4px #ccc;
    }
    .card a { 
      display: inline-block; margin-top: 8px; padding: 8px 15px; 
      background: #28a745; color: white; text-decoration: none; 
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Bhopal Business Info</h1>
  
  <button class="btn" onclick="showShops()">🛍️ Dukaan / Shops</button>
  <button class="btn" onclick="showServices()">🔧 Services</button>
  <button class="btn" onclick="showFood()">🍕 Khana / Food</button>
  
  <div id="list"></div>

  <script>
    function showShops() {
      document.getElementById('list').innerHTML = `
        <div class="card">
          <b>New Market Cloth House</b><br>
          Saree, Suit, Readymade<br>
          New Market, Bhopal<br>
          <a href="tel:07554000001">Call Karein</a>
        </div>
        <div class="card">
          <b>Top N Town Electronics</b><br>
          Mobile, TV, Fridge<br>
          MP Nagar Zone-1, Bhopal<br>
          <a href="tel:07554000002">Call Karein</a>
        </div>
      `;
    }

    function showServices() {
      document.getElementById('list').innerHTML = `
        <div class="card">
          <b>Sharma AC Repair</b><br>
          AC, Fridge, Washing Machine<br>
          Kolar Road, Bhopal<br>
          <a href="tel:9876543210">Call Karein</a>
        </div>
        <div class="card">
          <b>City Cab Service</b><br>
          24x7 Taxi, Airport Pickup<br>
          Bhopal Station<br>
          <a href="tel:9898989898">Call Karein</a>
        </div>
      `;
    }

    function showFood() {
      document.getElementById('list').innerHTML = `
        <div class="card">
          <b>Manohar Dairy</b><br>
          Poha, Jalebi, Sweets<br>
          Hamidia Road, Bhopal<br>
          <a href="tel:07552500001">Call Karein</a>
        </div>
        <div class="card">
          <b>Indian Coffee House</b><br>
          South Indian, Coffee<br>
          New Market, Bhopal<br>
          <a href="tel:07552500002">Call Karein</a>
        </div>
      `;
    }
  </script>
</body>
</html>
