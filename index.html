<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhopal Business Info</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 10px; background: #f0f8ff; }
    h1 { text-align: center; color: #0066cc; }
    .btn { 
      width: 100%; padding: 15px; margin: 8px 0; 
      background: #0066cc; color: white; border: none; 
      border-radius: 8px; font-size: 18px; font-weight: bold;
    }
    .card { 
      background: white; padding: 15px; margin: 10px 0; 
      border-radius: 8px; box-shadow: 0 2px 4px #ccc;
    }
    .card a { 
      display: inline-block; margin-top: 8px; padding: 8px 15px; 
      background: #28a745; color: white; text-decoration: none; 
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Bhopal Business Info</h1>
  
  <button class="btn" onclick="showSupermarket()">🛒 Supermarket</button>
  <button class="btn" onclick="showCloth()">👔 Cloth Store</button>
  <button class="btn" onclick="showJewellery()">💍 Jewellery</button>
  <button class="btn" onclick="showShoes()">👟 Shoes</button>
  <button class="btn" onclick="showSports()">⚽ Sports</button>
  <button class="btn" onclick="showMedical()">💊 Medical Store</button>
  <button class="btn" onclick="showAutoParts()">🔩 Auto Parts</button>
