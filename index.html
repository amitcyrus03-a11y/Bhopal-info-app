<!DOCTYPE html>
<html>
<head>
  <title>Bhopal Info</title>
  <style>
    .card { border:1px solid #ccc; padding:10px; margin:10px; border-radius:8px; }
    .tag { background:#eee; padding:2px 6px; margin:2px; border-radius:4px; font-size:12px; }
    .card-btn { background:#007bff; color:white; padding:5px 10px; margin:5px; text-decoration:none; border-radius:4px; display:inline-block; }
    button { padding:10px; margin:5px; }
  </style>
</head>
<body>
  <h2>Bhopal Info</h2>
  
  <button onclick="showRestaurant()">Restaurant</button>
  <button onclick="showElectronics()">Electronics</button>
  
  <div id="list"></div>

  <script>
    function showRestaurant() {
      document.getElementById('list').innerHTML = `
        <div class="card"><b>Indian Coffee House</b> ⭐ 4.2<br>📍 New Market<br>🕒 9:00 AM - 10:00 PM</div>
        <div class="card"><b>Sagar Gaire</b> ⭐ 4.0<br>📍 MP Nagar<br>🕒 10:00 AM - 11:00 PM</div>
        <div class="card"><b>Bapu Ki Kutia</b> ⭐ 4.3<br>📍 TT Nagar<br>🕒 8:00 AM - 10:00 PM</div>
      `;
    }

    function showElectronics() {
      document.getElementById('list').innerHTML = `
        <div class="card"><b>Reliance Digital</b> ⭐ 4.4<br>📍 DB City Mall<br>🕒 10:00 AM - 10:00 PM</div>
        <div class="card"><b>Croma Electronics</b> ⭐ 4.3<br>📍 Ashima Mall<br>🕒 10:00 AM - 10:00 PM</div>
        <div class="card"><b>Vijay Sales</b> ⭐ 4.2<br>📍 MP Nagar<br>🕒 10:00 AM - 9:30 PM</div>
      `;
    }
  </script>
</body>
</html>
